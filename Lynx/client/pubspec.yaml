name: client
description: "Lynx Launcher — вход, проекты, каталог, новости; отдельно собирается Lynx Editor (см. lib/main_editor.dart)."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  app_links: ^6.4.0
  provider: ^6.1.5
  go_router: ^17.1.0
  dio: ^5.4.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  path: ^1.9.0
  split_view: ^3.2.1
  file_picker: ^10.3.10
  path_provider: ^2.1.1
  mime: ^2.0.0
  ffi: ^2.0.0
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  google_fonts: ^8.0.2
  archive: ^3.6.1
  crypto: ^3.0.3
  audioplayers: ^6.6.0
  cryptography: ^2.9.0
  cupertino_icons: ^1.0.9
  args: ^2.5.0
  xml: ^6.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: assets/icon/nexus_launcher.png
  macos:
    generate: true
    image_path: assets/icon/nexus_launcher.png
  image_path: assets/icon/nexus_launcher.png
  adaptive_icon_background: "#3D1B7B"
  adaptive_icon_foreground: assets/icon/nexus_launcher.png

flutter:
  uses-material-design: true
  assets:
    - assets/icon/nexus_launcher.png