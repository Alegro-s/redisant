services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - nexus_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  api:
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_started

volumes:
  nexus_redis_data:
