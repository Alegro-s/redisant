<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#34B67A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Waypoint" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Waypoint</title>
    <script>
      (function () {
        var h = location.hostname;
        if (h === 'waypointclub.ru' || h === 'www.waypointclub.ru') {
          document.title = 'Waypoint Club — экосистема Waypoint';
          var m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (m) m.setAttribute('content', 'Waypoint Club');
        } else if (h.indexOf('desktop.') !== -1 && h.indexOf('metrika') !== -1) {
          document.title = 'Waypoint Desktop';
          var md = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (md) md.setAttribute('content', 'Waypoint Desktop');
        } else if (h.indexOf('metrika') !== -1) {
          document.title = 'Waypoint Metric — облако';
          var m2 = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (m2) m2.setAttribute('content', 'Waypoint Metric');
        } else if (h === 'localhost' || h === '127.0.0.1') {
          document.title = 'Waypoint Club';
        }
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
