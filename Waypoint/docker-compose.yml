

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes:
      - nexus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nexus_uploads:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://nexus:nexus@db:5432/nexus}
      BIND_ADDRESS: 0.0.0.0:8080
      NEXUS_ENV: production
      MODULE_TEST_UPLOAD_DIR: /app/uploads/module-tests
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:-local-docker-dev-only-min-32-chars-not-for-public-vps}
      ADMIN_OPEN_REGISTRATION: ${ADMIN_OPEN_REGISTRATION:-0}
      NEXUS_BOOTSTRAP_ADMIN_EMAIL: ${NEXUS_BOOTSTRAP_ADMIN_EMAIL:-}
      OTP_WEBHOOK_URL: ${OTP_WEBHOOK_URL:-}
      OTP_WEBHOOK_SECRET: ${OTP_WEBHOOK_SECRET:-}
      WAYPOINT_ALERT_EMAIL_TO: ${WAYPOINT_ALERT_EMAIL_TO:-}
      OTP_LOG_CODES: ${OTP_LOG_CODES:-0}
      OTP_CODE_PEPPER: ${OTP_CODE_PEPPER:-}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
      NEXUS_SYSTEM_METRICS_FALLBACK: ${NEXUS_SYSTEM_METRICS_FALLBACK:-1}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexus_pg_data:
  nexus_uploads:
