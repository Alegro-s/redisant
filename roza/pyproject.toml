[project]
name = "roza-assistant"
version = "0.3.0"
description = "Локальный ассистент Roza: Companion (иконка), веб, Python desktop, голос, HF/Ollama/OpenAI/llama.cpp"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pyyaml>=6.0.1",
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.32.0",
  "edge-tts>=6.1.0",
]

[project.optional-dependencies]
llama = [
  "llama-cpp-python>=0.2.90",
]
desktop = [
  "pywebview>=5.0",
]
hf = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "accelerate>=0.27.0",
  "huggingface_hub>=0.36.0",
]
train = [
  "torch>=2.1.0",
  "transformers>=4.40.0",
  "datasets>=2.16.0",
  "accelerate>=0.27.0",
  "huggingface_hub>=0.36.0",
  "peft>=0.10.0",
  "trl>=0.9.0",
  "safetensors>=0.4.0",
]

[project.scripts]
roza = "roza.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["roza*"]

[tool.setuptools.package-data]
roza = ["web/static/*", "assets/*"]
