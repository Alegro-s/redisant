# Roza — локальный ассистент. См. OFERTA.md (условия использования).
#
# Сильная модель с ПК (Kimi / QwQ в LM Studio, koboldcpp, Ollama и т.п.):
#   llm.backend: openai_compatible
#   openai_compatible.base_url: http://127.0.0.1:ПОРТ/v1
#   openai_compatible.model: имя модели в сервере (как в /v1/models)
# Один сервер — много пользователей: поднимите roza web на 0.0.0.0 и при необходимости
#   web.cors_origins: ["http://IP:порт"] для фронта с другой машины (или "*" только в LAN).

# LLM: hf_local | llama_cpp | openai_compatible | ollama
llm:
  backend: hf_local

assistant:
  name: Roza
  # Два запроса к LLM: сначала короткий план, затем ответ (сильнее рассуждения, дольше и дороже по токенам)
  think_first: false
  # «Рой»: доп. инструкция в системном промпте (координация шагов)
  swarm_prompt: true
  terms: |
    Ты — Roza: спокойный, дружелюбный женский тон (без излишней театральности).
    Отвечай ТОЛЬКО на русском одним связным текстом, если пользователь не просит иной язык.
    Не вставляй английские слова в русские предложения (никаких thy, situation, perhaps и т.п.).
    Не повторяй и не «переводи» вопрос в начале — сразу по делу.
    Не вставляй китайские/японские символы и случайные англ. фразы без запроса.
    Не смешивай языки в одном предложении. Не выдумывай несуществующие слова.
    Ответы могут попадать в журнал обучения — формулируй так, чтобы диалог был пригоден как образец.

    Код и архитектура:
    Код только в блоках с указанием языка; пояснения к коду — на русском.
    Стек, с которым чаще всего работают: C#, Rust, Python, JavaScript/TypeScript, React,
    SQL (PostgreSQL), Dart/Flutter — пиши идиоматично, указывай версии и пакеты, если важно для сборки.
    Перед выводом по проекту: если доступен workspace и агент — сначала list_dir/read_file по относительным путям,
    затем ответ с опорой на файлы; не выдумывай структуру каталогов.
    Единый стиль, осмысленные имена, без мёртвого кода и случайных заглушек; краткие комментарии на русском к неочевидному.

    Творчество (тексты, идеи, сценарии):
    Разделяй черновик и финал, если просят несколько вариантов — нумеруй кратко.
    Соблюдай заданный жанр, тон и ограничения по длине; избегай штампов и «воды».
    Если задача творческая, допускается чуть более образная лексика в рамках русского языка.

    Автоматизация рутины:
    Давай пошаговые инструкции и готовые шаблоны (команды, чеклисты, письма, скрипты), которые можно скопировать.
    Для повторяющихся действий предлагай вынести логику в один сценарий или компонент из whitelist.
    В режиме агента инструменты только через ROZA_TOOL и только из components.yaml.

ollama:
  base_url: http://127.0.0.1:11434
  model: qwen2.5-coder:7b
  think: false
  # false — меньше сбоев 503 и совместимость со старыми версиями Ollama
  send_think_param: false
  options:
    num_ctx: 4096
    num_predict: 2048
    temperature: 0.25
  # false — стабильнее для Ollama; потоковый вывод в вебе пока отдельно
  stream_chat: false

# Постобработка ответа модели (убирает типичный мусор R1)
model_output:
  strip_thinking: true
  strip_cjk: true
  # Удаляет типичные англ. вставки в преимущественно русском тексте (thy, situation…)
  strip_en_leaks: true

# Озвучка: edge — нейросеть Microsoft (качественнее браузера). Человеческая запись на любой текст невозможна.
voice:
  provider: edge
  edge_voice: ru-RU-SvetlanaNeural
  # Голос: пока не сказано имя — команды в LLM не уходят (спящий режим прослушивания)
  require_wake_word: true
  wake_words:
    - роза
    - roza
  # Старт микрофона при открытии окна (в части браузеров нужен один клик по странице/сфере)
  auto_start_listening: true
  # После слова «Роза» без текста команды — ждать следующую фразу (секунды)
  wake_latch_seconds: 12

openai_compatible:
  base_url: http://127.0.0.1:1234/v1
  api_key: ""
  model: ""
  max_tokens: 2048

# Локальная instruct-модель с Hugging Face (pip install -e ".[hf]" или ".[train]")
hf_local:
  model_id: Qwen/Qwen2.5-0.5B-Instruct
  # Пресеты для API POST /api/llm/preset (light | strong) и для Companion
  preset_light: Qwen/Qwen2.5-0.5B-Instruct
  preset_strong: Qwen/Qwen2.5-1.5B-Instruct
  max_new_tokens: 384
  device: auto
  # Чуть ниже — стабильнее код и рутина; для «чистого творчества» временно поднимите до 0.4–0.55.
  temperature: 0.30

llama_cpp:
  # Без Transformers: model_path к .gguf и llm.backend: llama_cpp
  model_path: ""
  n_ctx: 4096
  n_gpu_layers: 0
  n_threads: 0

# Пример: агент читает ваш проект player (путь абсолютный или относительно каталога config.yaml)
# workspace:
#   roots:
#     - .
#     - D:/player
workspace:
  roots:
    - .

components_file: components.yaml

agent:
  # Чуть больше шагов агента при обходе репозитория и рутинных цепочек list_dir/read_file.
  max_tool_turns: 18

web:
  # 0.0.0.0 — доступ в локальной сети (осторожно: без HTTPS). Для только этого ПК: 127.0.0.1
  host: 127.0.0.1
  port: 8765
  # CORS для UI с другого origin (например телефон → http://ПК:8765). Пусто — не добавлять.
  # cors_origins:
  #   - "http://192.168.1.10:3000"

desktop:
  # Компактнее, чем на весь экран — как раньше удобнее перетаскивать и сворачивать.
  width: 980
  height: 720
  title: Roza
  # false — рамка Windows/macOS: свернуть, развернуть, переключение Alt+Tab как у обычных окон.
  frameless: false
  # false — старт в оконном режиме; развернуть вручную при необходимости.
  maximized: false
  # true — два окна: «диалог» и «студия»; переключайтесь между ними. false — одно окно со вкладками.
  dual_window: true

learning:
  enabled: true
  log_path: data/roza_learn.jsonl
  include_system_in_log: false
