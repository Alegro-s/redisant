# Скопируйте в components.yaml и отредактируйте под свою машину.
# Выполняются ТОЛЬКО действия из этого файла — произвольные команды модель запустить не может.

components:
  # Пример: локальный сервис через скрипты (пути и команды замените на свои)
  demo_echo:
    title: Demo echo
    actions:
      start: { command: ["cmd", "/c", "echo", "start demo"] }
      stop: { command: ["cmd", "/c", "echo", "stop demo"] }
      status: { command: ["cmd", "/c", "echo", "status ok"] }

