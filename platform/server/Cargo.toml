[package]
name = "po-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "auth-api"
path = "src/main.rs"

[[bin]]
name = "waypoint-api"
path = "src/main.rs"

[[bin]]
name = "lynx-api"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.6"
actix-multipart = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "=9.3.0"          
rand = "0.10.0"
rand_core = "0.10"
bcrypt = "0.15"
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
anyhow = "1"
futures-util = "0.3"
mime = "0.3"
sha2 = "0.10"
hmac = "0.12"
sysinfo = "0.38.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
actix-governor = "0.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-log = "0.2.0"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
urlencoding = "2.1"
actix-ws = "0.3"
prometheus = "0.13"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
