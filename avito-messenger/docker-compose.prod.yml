
services:
  db:
    image: postgres:16-alpine
    container_name: aishield-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aishield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aishield_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aishield}
    volumes:
      - aishield_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aishield} -d ${POSTGRES_DB:-aishield}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aishield-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DEBUG: "false"
      AI_SERVICE_URL: ""
      MATTERMOST_URL: http://mattermost:8065
      PUBLIC_HOST: ${PUBLIC_HOST:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./admin-panel:/admin-panel:ro
      - ./data:/app/data
      - ./media:/app/media
      - ./backend/data/profiles.json:/app/data/profiles.json:ro
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed_users || true &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"

  mattermost-db:
    image: postgres:16-alpine
    container_name: mattermost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${MM_DB_PASSWORD:-mmuser_password}
      POSTGRES_DB: mattermost
    volumes:
      - mattermost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 5

  mattermost:
    image: mattermost/mattermost-team-edition:9.11
    container_name: mattermost
    restart: unless-stopped
    depends_on:
      mattermost-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MATTERMOST_PORT:-8065}:8065"
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_config:/mattermost/config
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${MM_DB_PASSWORD:-mmuser_password}@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_SITEURL:-http://localhost:8065}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: "api localhost 127.0.0.1"
      MM_TEAMSETTINGS_ENABLEUSERCREATION: "false"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_FILESETTINGS_DRIVERNAME: local
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"

volumes:
  aishield_pgdata:
  mattermost_pgdata:
  mattermost_data:
  mattermost_logs:
  mattermost_config:
  mattermost_plugins:
  mattermost_client_plugins:
