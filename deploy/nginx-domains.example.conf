# Пример nginx для доменов Waypoint / Lynx (один VPS, статика из dist).
# Скопируйте в sites-available и подставьте пути к сборкам.

# waypointclub.ru + metrika-waypoint.ru — одна сборка Waypoint/web (различие по server_name → тот же index, hostname в SPA)
server {
    listen 443 ssl http2;
    server_name waypointclub.ru www.waypointclub.ru metrika-waypoint.ru www.metrika-waypoint.ru;

    root /var/www/waypoint-web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
    }
    location /auth/ {
        proxy_pass http://127.0.0.1:8090/;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# lynx-hub.ru — Lynx/hub/dist
server {
    listen 443 ssl http2;
    server_name lynx-hub.ru www.lynx-hub.ru;
    root /var/www/lynx-hub/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# lynx-cloud.ru — Lynx/cloud (next export или standalone)
server {
    listen 443 ssl http2;
    server_name lynx-cloud.ru www.lynx-cloud.ru;
    # proxy_pass на next start :3001 или статика out/
}
