# waypoint-api + lynx-api (БД — контейнер waypoint-db из auth-стека)
# Запуск из deploy/ecosystem: .\scripts\start-apis.ps1
name: waypoint-apis

services:
  waypoint-api:
    container_name: waypoint-waypoint-api
    build:
      context: ../../platform/server
      dockerfile: Dockerfile
      args:
        PO_BIN: waypoint-api
    restart: unless-stopped
    environment:
      PO_SERVICE: waypoint
      RUN_MIGRATIONS: "0"
      BIND_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: postgres://waypoint:${POSTGRES_PASSWORD}@waypoint-db:5432/waypoint
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_PUBLIC_URL: http://waypoint-auth-api:8090
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - waypoint_uploads:/app/uploads
    networks:
      - waypoint_net

  lynx-api:
    container_name: waypoint-lynx-api
    build:
      context: ../../platform/server
      dockerfile: Dockerfile
      args:
        PO_BIN: lynx-api
    restart: unless-stopped
    environment:
      PO_SERVICE: lynx
      RUN_MIGRATIONS: "0"
      BIND_ADDRESS: 0.0.0.0:8082
      DATABASE_URL: postgres://waypoint:${POSTGRES_PASSWORD}@waypoint-db:5432/waypoint
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_PUBLIC_URL: http://waypoint-auth-api:8090
    ports:
      - '127.0.0.1:8082:8082'
    volumes:
      - lynx_uploads:/app/uploads
    networks:
      - waypoint_net

networks:
  waypoint_net:
    external: true
    name: waypoint_net

volumes:
  waypoint_uploads:
  lynx_uploads:
