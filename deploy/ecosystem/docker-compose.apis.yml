# waypoint-api + lynx-api (БД — контейнер waypoint-db из auth-стека)
# Запуск из deploy/ecosystem: .\scripts\start-apis.ps1
name: waypoint-apis

services:
  waypoint-api:
    container_name: waypoint-waypoint-api
    build:
      context: ../../platform/server
      dockerfile: Dockerfile
      args:
        PO_BIN: waypoint-api
    restart: unless-stopped
    environment:
      PO_SERVICE: waypoint
      RUN_MIGRATIONS: "0"
      BIND_ADDRESS: 0.0.0.0:8080
      DATABASE_URL: postgres://waypoint:${POSTGRES_PASSWORD}@waypoint-db:5432/waypoint
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_PUBLIC_URL: http://waypoint-auth-api:8090
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - waypoint_uploads:/app/uploads
    networks:
      - waypoint_net

  lynx-api:
    container_name: waypoint-lynx-api
    build:
      context: ../../platform/server
      dockerfile: Dockerfile
      args:
        PO_BIN: lynx-api
    restart: unless-stopped
    environment:
      PO_SERVICE: lynx
      RUN_MIGRATIONS: ${LYNX_RUN_MIGRATIONS:-1}
      BIND_ADDRESS: 0.0.0.0:8082
      DATABASE_URL: postgres://waypoint:${POSTGRES_PASSWORD}@waypoint-db:5432/waypoint
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_PUBLIC_URL: http://waypoint-auth-api:8090
      LYNX_HUB_ADMIN_TOKEN: ${LYNX_HUB_ADMIN_TOKEN:-}
      LYNX_OPS_EMAILS: ${LYNX_OPS_EMAILS:-rozalityai@gmail.com}
      LYNX_S3_ENDPOINT: ${LYNX_S3_ENDPOINT:-https://s3.twcstorage.ru}
      LYNX_S3_BUCKET: ${LYNX_S3_BUCKET:-bc39a46d-ee3d-4707-9e3f-9529afb602da}
      LYNX_S3_REGION: ${LYNX_S3_REGION:-ru-1}
      LYNX_S3_ACCESS_KEY: ${LYNX_S3_ACCESS_KEY:-}
      LYNX_S3_SECRET_KEY: ${LYNX_S3_SECRET_KEY:-}
      LYNX_S3_PUBLIC_BASE: ${LYNX_S3_PUBLIC_BASE:-https://lynx-hub.ru/downloads}
      LYNX_ENGINE_MANIFEST_S3_KEY: ${LYNX_ENGINE_MANIFEST_S3_KEY:-deploy/sites/latest/dist/downloads/engine-manifest.json}
      LYNX_ENGINE_MANIFEST_FILE: ${LYNX_ENGINE_MANIFEST_FILE:-/lynx-hub/downloads/engine-manifest.json}
    ports:
      - '127.0.0.1:8082:8082'
    volumes:
      - lynx_uploads:/app/uploads
      - /srv/lynx-hub/dist/downloads:/lynx-hub/downloads:ro
    networks:
      - waypoint_net

networks:
  waypoint_net:
    external: true
    name: waypoint_net

volumes:
  waypoint_uploads:
  lynx_uploads:
