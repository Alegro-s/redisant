# HTTP-only (первичная установка до certbot). Не перезаписывать вручную на проде с SSL.
# deploy: server-02 подставляет waypoint-ecosystem.conf.template если есть сертификат.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream lynx_cloud_next {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream auth_api {
    server 127.0.0.1:8090;
    keepalive 16;
}

upstream waypoint_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream lynx_product_api {
    server 127.0.0.1:8082;
    keepalive 16;
}

upstream roza_api {
    server 127.0.0.1:8765;
    keepalive 8;
}

# --- Lynx Cloud ---
server {
    listen 80;
    server_name lynx-cloud.ru www.lynx-cloud.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /auth/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://auth_api/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_pass http://lynx_cloud_next;
    }
}

# --- Lynx Hub ---
server {
    listen 80;
    server_name lynx-hub.ru www.lynx-hub.ru;

    root /srv/lynx-hub/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /auth/ {
        proxy_pass http://auth_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
        try_files /favicon.svg =404;
    }

    location /downloads/ {
        alias /srv/lynx-hub/dist/downloads/;
        add_header Content-Disposition "attachment";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

