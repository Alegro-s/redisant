# --- Waypoint Club + Roza ---
server {
    listen 80;
    server_name waypointclub.ru www.waypointclub.ru;

    root /srv/waypointclub/web;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location /auth/ {
        proxy_pass http://auth_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        default_type image/svg+xml;
        add_header Cache-Control "public, max-age=86400";
        try_files /favicon-club.svg /favicon.svg =404;
    }

    location ^~ /roza/api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_pass http://roza_api/api/;
    }

    location ^~ /roza/ {
        root /srv/roza/web;
        try_files $uri $uri/ /roza/index.html;
    }

    location /api/ {
        proxy_pass http://waypoint_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
