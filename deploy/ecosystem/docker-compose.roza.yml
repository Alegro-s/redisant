name: roza-stack

services:
  roza-api:
    build:
      context: ../../roza
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ROZA_AUTH_URL: http://auth-api:8090
      ROZA_PLATFORM_INTROSPECT: http://auth-api:8090/auth/introspect
    ports:
      - '127.0.0.1:8765:8765'
    networks:
      - waypoint_net

networks:
  waypoint_net:
    external: true
    name: waypoint_net
