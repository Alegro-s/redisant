name: roza-stack

services:
  roza-api:
    container_name: local-roza-api
    build:
      context: ../../roza
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ROZA_CONFIG: /app/config.yaml
      ROZA_AUTH_URL: http://waypoint-auth-api:8090
      ROZA_PLATFORM_INTROSPECT: http://waypoint-auth-api:8090/auth/introspect
    volumes:
      - ../../roza/config.yaml:/app/config.yaml:ro
    ports:
      - '127.0.0.1:8765:8765'
    networks:
      - waypoint_net

networks:
  waypoint_net:
    external: true
    name: waypoint_net
